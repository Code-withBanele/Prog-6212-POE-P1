name: Submission Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-submission:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required submission files
        shell: bash
        run: |
          set -e

          required_files=(
            "README.md"
            "DOCS/ERD DRAFT 1.png"
            "DOCS/ERD DRAFT 2.png"
            "DOCS/RaceDay API Endpoint Plan.pdf"
            "DOCS/raceday.sql"
          )

          echo "Checking required RaceDay Part 1 submission files..."

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file is missing: $file"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "ERROR: Required file is empty: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "All required submission files are present and non-empty."

      - name: Validate documentation folder
        shell: bash
        run: |
          if [ ! -d "DOCS" ]; then
            echo "ERROR: DOCS folder is missing."
            exit 1
          fi

          echo "OK: DOCS folder exists."
