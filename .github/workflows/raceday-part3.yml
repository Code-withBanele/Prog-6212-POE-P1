name: RaceDay Part 3 CI

on:
  push:
    branches:
      - part-3-mvc
  pull_request:
    branches:
      - part-3-mvc

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution projects
        run: |
          dotnet restore RaceDay/RaceDay.csproj
          dotnet restore RaceDay.Web/RaceDay.Web.csproj
          dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build API
        run: dotnet build RaceDay/RaceDay.csproj --configuration Release --no-restore

      - name: Build MVC
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RaceDay/Dockerfile
          push: false
          tags: raceday-api:ci

      - name: Build MVC Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: RaceDay.Web/Dockerfile
          push: false
          tags: raceday-web:ci
