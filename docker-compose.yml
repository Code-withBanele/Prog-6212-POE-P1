services:
  raceday-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in your .env file}
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  raceday-migrate:
    build:
      context: .
      dockerfile: RaceDay/Dockerfile
    image: raceday-api:local
    container_name: raceday-migrate
    entrypoint: ["/app/efbundle"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceDayConnection: "Server=raceday-db,1433;Database=RaceDayApiDB;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in your .env file};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      raceday-db:
        condition: service_healthy
    restart: "no"

  raceday-api:
    image: raceday-api:local
    build:
      context: .
      dockerfile: RaceDay/Dockerfile
    container_name: raceday-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DisableHttpsRedirection: "true"
      ConnectionStrings__RaceDayConnection: "Server=raceday-db,1433;Database=RaceDayApiDB;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in your .env file};Encrypt=True;TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      Jwt__Issuer: RaceDayApi
      Jwt__Audience: RaceDayClient
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_STORAGE_CONNECTION_STRING:-}
    ports:
      - "8081:8080"
    depends_on:
      raceday-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  raceday-web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    image: raceday-web:local
    container_name: raceday-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DisableHttpsRedirection: "true"
      RaceDayApi__BaseUrl: http://raceday-api:8080/
    ports:
      - "8080:8080"
    depends_on:
      raceday-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  raceday-sql-data:
